services:

  back_web:
    build:
      context: ./back_web
      dockerfile: Dockerfile

    container_name: new_glass_backend

    ports:
      - "8000:8000"

    volumes:
      - ./back_web:/app

    restart: unless-stopped


  front_web:
    build:
      context: ./front_web
      dockerfile: Dockerfile.f

    container_name: new_glass_frontend

    ports:
      - "5173:5173"

    volumes:
      - ./front_web:/app
      - front_web_node_modules:/app/node_modules

    depends_on:
      - back_web

    restart: unless-stopped


volumes:
  front_web_node_modules: