services:

  back_web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: new_glass_backend

    ports:
      - "8000:8000"

    volumes:
      - ./back_web:/app

    environment:
      DJANGO_DEBUG: "1"

    restart: unless-stopped


  front_web:
    build:
      context: .
      dockerfile: Dockerfile.f

    container_name: new_glass_frontend

    ports:
      - "5173:5173"

    volumes:
      - ./front_web:/app
      - /app/node_modules

    depends_on:
      - back_web

    restart: unless-stopped